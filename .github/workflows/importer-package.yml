name: Package tested importer
on:
  push:
    branches: [fix/station-priority-and-import-20261109]
    paths: ['extension/**', '.github/workflows/importer-package.yml']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Produce reproducible extension package and fingerprint
        run: |
          python - <<'PY'
          import base64,hashlib,io,json,pathlib,zipfile
          root=pathlib.Path('extension')
          names=['manifest.json','background.js','bridge.js','google-route-page.js','google-route-parser.js']
          fingerprint=hashlib.sha256()
          archive=io.BytesIO()
          with zipfile.ZipFile(archive,'w',compression=zipfile.ZIP_DEFLATED) as z:
            for name in names:
              content=(root/name).read_bytes()
              fingerprint.update((name+'\n').encode());fingerprint.update(content)
              info=zipfile.ZipInfo(name,date_time=(2026,11,9,0,0,0));info.compress_type=zipfile.ZIP_DEFLATED
              z.writestr(info,content)
          data=archive.getvalue()
          print('IMPORTER_PACKAGE '+json.dumps({'version':json.loads((root/'manifest.json').read_text())['version'],'extension_sha256':fingerprint.hexdigest(),'zip_sha256':hashlib.sha256(data).hexdigest(),'base64':base64.b64encode(data).decode()}))
          PY
