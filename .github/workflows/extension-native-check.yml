name: Native extension check
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [extension-native-transport-20261109]
    paths:
      - 'extension/**'
      - 'scripts/check-native-extension.mjs'
      - 'scripts/check-routing-live.mjs'
      - '.github/workflows/extension-native-check.yml'
permissions:
  contents: read
jobs:
  native-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Verify the distributed importer matches the tested source
        run: |
          python - <<'PY'
          import json,pathlib,zipfile
          root=pathlib.Path('extension')
          version=json.loads((root/'manifest.json').read_text())['version']
          with zipfile.ZipFile('downloads/our-house-hunt-importer-v'+version+'.zip') as archive:
            names=['manifest.json','background.js','bridge.js','google-route-page.js','google-route-parser.js']
            assert sorted(archive.namelist())==sorted(names)
            for name in names:assert archive.read(name)==(root/name).read_bytes(),name
          print('IMPORTER_PACKAGE_SOURCE_PASS',version)
          PY
      - name: Check catalogue controls in Chromium
        run: node scripts/check-catalogue-ui.mjs
        env:
          HH_UI_SNAPSHOT_LOG: '1'
      - name: Check real listing text and floor-plan OCR
        run: xvfb-run --auto-servernum node scripts/check-floorplan-outdoors.mjs
      - run: xvfb-run --auto-servernum node scripts/check-native-extension.mjs
      - run: xvfb-run --auto-servernum node scripts/check-routing-live.mjs
