name: Station and import diagnosis
on:
  push:
    branches: [fix/station-priority-and-import-20261109]
    paths: ['scripts/diagnose-station-import.mjs', '.github/workflows/station-import-diagnosis.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run --auto-servernum node scripts/diagnose-station-import.mjs
