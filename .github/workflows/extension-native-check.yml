name: Native extension check
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [extension-native-transport-20261109]
    paths:
      - 'extension/**'
      - 'scripts/check-native-extension.mjs'
      - 'scripts/check-routing-live.mjs'
      - '.github/workflows/extension-native-check.yml'
permissions:
  contents: read
jobs:
  native-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Verify the distributed importer matches the tested source
        run: |
          python - <<'PY'
          import json,pathlib,zipfile
          root=pathlib.Path('extension')
          version=json.loads((root/'manifest.json').read_text())['version']
          with zipfile.ZipFile('downloads/our-house-hunt-importer-v'+version+'.zip') as archive:
            names=['manifest.json','background.js','bridge.js','google-route-page.js','google-route-parser.js']
            assert sorted(archive.namelist())==sorted(names)
            for name in names:assert archive.read(name)==(root/name).read_bytes(),name
          print('IMPORTER_PACKAGE_SOURCE_PASS',version)
          PY
      - name: Check catalogue controls in Chromium
        run: node scripts/check-catalogue-ui.mjs
        env:
          HH_UI_SNAPSHOT_LOG: '1'
      - name: Check real listing text and floor-plan OCR
        run: xvfb-run --auto-servernum node scripts/check-floorplan-outdoors.mjs
      - name: Compare routing inputs with the successful v65 live check
        id: routing_baseline
        run: |
          python - <<'PYCODE'
          import hashlib,json,pathlib,re,os,urllib.request
          baseline=json.loads(pathlib.Path('.github/routing-baseline-v65.json').read_text())
          changed=[]
          for path,expected in baseline['files'].items():
            file=pathlib.Path(path)
            if not file.is_file():changed.append(path);continue
            data=file.read_bytes()
            if path=='index.html':
              value=data.decode()
              value=re.sub(r'>v\d+</span>','>VERSION</span>',value)
              value=re.sub(r'(outdoor-details|outdoor-refresh|floorplan-ocr)\.js\?v=\d+',r'\1.js?v=VERSION',value)
              data=value.encode()
            if hashlib.sha256(data).hexdigest()!=expected:changed.append(path)
          verified=False
          if not changed:
            try:
              with urllib.request.urlopen('https://api.github.com/repos/sabinacoaching/Our-house-hunt/actions/runs/'+str(baseline['successful_run']),timeout=15) as response:run=json.load(response)
              verified=run.get('head_sha')==baseline['commit'] and run.get('conclusion')=='success'
            except Exception as error:print('ROUTING_BASELINE_STATUS_UNAVAILABLE',type(error).__name__)
          if not verified:changed.append('successful live run not verified')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('unchanged='+str(not changed).lower()+'\n')
          print('ROUTING_BASELINE_MATCH' if not changed else 'ROUTING_INPUTS_CHANGED',baseline['commit'],baseline['successful_run'],changed)
          PYCODE
      - if: steps.routing_baseline.outputs.unchanged != 'true'
        run: xvfb-run --auto-servernum node scripts/check-native-extension.mjs
      - if: steps.routing_baseline.outputs.unchanged != 'true'
        run: xvfb-run --auto-servernum node scripts/check-routing-live.mjs
