name: Routing network check
on:
  workflow_dispatch:
  push:
    branches: [routing-architecture-20261109]
permissions:
  contents: read
jobs:
  station-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright-core@1.62.1
      - run: node scripts/check-google-maps.mjs
