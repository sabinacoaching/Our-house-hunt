name: Routing network check
on:
  workflow_dispatch:
  push:
    branches: [routing-architecture-20261109]
permissions:
  contents: read
jobs:
  station-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-station-catalogue.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: station-catalogue
          path: station-catalogue-raw.json
